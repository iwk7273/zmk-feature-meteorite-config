description: Meteorite encoder keymap slot dispatcher

compatible: "zmk,behavior-meteorite-encoder"

include: behavior-metadata.yaml

properties:
  label:
    type: string
    required: false
    deprecated: true
  "#sensor-binding-cells":
    type: int
    required: true
    const: 0
  slots:
    type: array
    required: true
    description: >
      Keymap positions used for encoder actions. Entries are ordered as
      sensor 0 CW, sensor 0 CCW, sensor 1 CW, sensor 1 CCW.
  tap-ms:
    type: int
    default: 5

sensor-binding-cells: []
