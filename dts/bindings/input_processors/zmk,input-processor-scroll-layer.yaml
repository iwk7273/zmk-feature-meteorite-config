description: Input processor that maps X/Y to scroll when configured layers are active

compatible: "zmk,input-processor-scroll-layer"

include: ip_zero_param.yaml

properties:
  layer-1:
    type: int
    required: false
    description: First layer index to enable scrolling when CONFIG_ZMK_CUSTOM_CONFIG is disabled.
  layer-2:
    type: int
    required: false
    description: Second layer index to enable scrolling when CONFIG_ZMK_CUSTOM_CONFIG is disabled.
  input-processors:
    type: phandle-array
    required: true
