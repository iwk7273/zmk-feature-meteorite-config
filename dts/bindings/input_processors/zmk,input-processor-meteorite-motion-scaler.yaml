# SPDX-License-Identifier: MIT

description: Meteorite input processor that scales relative pointer motion.

compatible: "zmk,input-processor-meteorite-motion-scaler"

include: ip_zero_param.yaml

properties:
  scaling-mode:
    type: int
    default: 0
    description: Fallback enable, 0 for disabled and non-zero for enabled.

  pointer-profile:
    type: int
    default: 0
    description: Fallback pointer profile, 0 Standard, 1 Stable, 2 Responsive, or 3 Custom.

  cpi:
    type: int
    default: 800
    description: Fallback sensor CPI used for physical-speed normalization.

  default-dt-ms:
    type: int
    default: 12
    description: Nominal report interval used for the first frame after a reset.
