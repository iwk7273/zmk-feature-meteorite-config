# SPDX-License-Identifier: MIT

description: Meteorite input processor that scales relative pointer motion.

compatible: "zmk,input-processor-meteorite-motion-scaler"

include: ip_zero_param.yaml

properties:
  scaling-mode:
    type: int
    required: false
    description: 0 disables pointer scaling, 1 enables it when CONFIG_ZMK_CUSTOM_CONFIG is disabled.
  max-output:
    type: int
    required: false
    description: Maximum absolute output value.
  half-input:
    type: int
    required: false
    description: Half-input value used for r=abs(input)/half-input.
  exponent-tenths:
    type: int
    required: false
    description: Exponent with 0.1 resolution.
